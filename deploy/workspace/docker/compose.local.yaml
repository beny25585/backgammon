name: backgammon-local

x-process: &process
  init: true
  restart: unless-stopped
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"
  networks: [application]

x-game: &game
  <<: *process
  image: backgammon-local-game
  build:
    context: ..
    dockerfile: docker/python.Dockerfile
    args:
      APP_DIR: Backgammon Game/backend
  environment: &game-environment
    DJANGO_SETTINGS_MODULE: backgammon_project.settings_docker
    RUNTIME_CONFIG_FILE: /run/secrets/game_config
    DB_HOST: postgres
    DB_NAME: backgammon_game
    DB_USER: backgammon_game
    DB_PASSWORD_FILE: /run/secrets/game_password
    DEBUG: "True"
    ALLOWED_HOSTS: localhost,127.0.0.1,backgammon.localhost,game-api,gateway
    CORS_ALLOWED_ORIGINS: http://backgammon.localhost:8180
    REDIS_URL: redis://redis:6379/0
    GAMELINK_ENABLED: "True"
    GAMELINK_TOURNAMENTS_URL: http://backgammon.localhost:8180
    GAMELINK_TOURNAMENTS_FRONTEND_URL: http://backgammon.localhost:8180
    GAMELINK_FRONTEND_URL: http://backgammon.localhost:8180/backgammon
    DICE_SERVICE_URL: http://dice:4000
    AI_SERVICE_URL: http://analysis-api:8000
    ANALYSIS_SERVICE_URL: http://analysis-api:8000
  secrets: [game_config, game_password]
  volumes: [game_static:/data/static]

x-tournaments: &tournaments
  <<: *process
  image: backgammon-local-tournaments
  build:
    context: ..
    dockerfile: docker/python.Dockerfile
    args:
      APP_DIR: backgammon-tournaments-backend
  working_dir: /app/tournaments
  environment:
    DJANGO_SETTINGS_MODULE: tournaments.settings.docker
    RUNTIME_CONFIG_FILE: /run/secrets/tournaments_config
    DB_HOST: postgres
    DB_NAME: backgammon_tournaments
    DB_USER: backgammon_tournaments
    DB_PASSWORD_FILE: /run/secrets/tournaments_password
    DEBUG: "1"
    ALLOWED_HOSTS: localhost,127.0.0.1,backgammon.localhost,tournaments-api,gateway
    CSRF_TRUSTED_ORIGINS: http://backgammon.localhost:8180
    CHANNEL_LAYER_BACKEND: redis
    REDIS_URL: redis://redis:6379/1
    GAMELINK_ENABLED: "1"
    GAMELINK_BACKGAMMON_URL: http://backgammon.localhost:8180
    ACCOUNT_FRONTEND_URL: http://backgammon.localhost:8180/tournaments
    ANALYSIS_SERVICE_URL: http://analysis-api:8000
    GOOGLE_CLIENT_ID: ""
    EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
    TRANZILA_ENABLED: "0"
    TRANZILA_PURCHASES_ENABLED: "0"
  secrets: [tournaments_config, tournaments_password]
  volumes: [tournaments_static:/data/static, tournaments_media:/data/media]

x-analysis: &analysis
  <<: *process
  image: backgammon-local-analysis
  build:
    context: ..
    dockerfile: docker/analysis.Dockerfile
  environment:
    DJANGO_SETTINGS_MODULE: config.docker
    RUNTIME_CONFIG_FILE: /run/secrets/analysis_config
    DB_HOST: postgres
    DB_NAME: backgammon_analysis
    DB_USER: backgammon_analysis
    DB_PASSWORD_FILE: /run/secrets/analysis_password
    DEBUG: "1"
    ALLOWED_HOSTS: localhost,127.0.0.1,analysis-api
  secrets: [analysis_config, analysis_password]

x-frontend: &frontend
  <<: *process
  mem_limit: 512m
  healthcheck:
    test: [CMD, node, -e, "fetch('http://localhost:5173/').then(r=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))"]
    interval: 20s
    timeout: 5s
    start_period: 30s
    retries: 5

services:
  config-init:
    image: backgammon-local-tournaments
    profiles: [setup]
    entrypoint: [python, /opt/docker/prepare_local.py]
    working_dir: /app
    user: "0:0"
    volumes: [./.local:/setup]
    network_mode: none
    restart: "no"

  postgres:
    <<: *process
    image: postgres:16
    mem_limit: 768m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
    secrets: [postgres_password, game_password, tournaments_password, analysis_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_databases.sh:/docker-entrypoint-initdb.d/10-app-databases.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    <<: *process
    image: redis:7-alpine
    mem_limit: 256m
    command: [redis-server, --appendonly, "yes", --maxmemory, 128mb, --maxmemory-policy, noeviction]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10

  dice:
    <<: *process
    image: backgammon-local-dice
    build:
      context: ..
      dockerfile: docker/dice.Dockerfile
    mem_limit: 256m
    environment:
      PORT: "4000"
      DICE_BIND_HOST: 0.0.0.0
    healthcheck:
      test: [CMD, curl, --fail, --silent, "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 5

  game-migrate:
    <<: *game
    restart: "no"
    command: [sh, -c, "python manage.py migrate --noinput && python manage.py collectstatic --noinput"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  tournaments-migrate:
    <<: *tournaments
    restart: "no"
    command: [sh, -c, "python manage.py migrate --noinput && python manage.py collectstatic --noinput"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  analysis-migrate:
    <<: *analysis
    restart: "no"
    command: [python, manage.py, migrate, --noinput]
    depends_on:
      postgres: {condition: service_healthy}

  game-api:
    <<: *game
    mem_limit: 512m
    command: [daphne, -b, 0.0.0.0, -p, "8000", backgammon_project.asgi:application]
    depends_on:
      game-migrate: {condition: service_completed_successfully}
      dice: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=5)"]
      interval: 20s
      timeout: 7s
      start_period: 30s
      retries: 5

  tournaments-api:
    <<: *tournaments
    mem_limit: 512m
    command: [daphne, -b, 0.0.0.0, -p, "8000", tournaments.asgi:application]
    depends_on:
      tournaments-migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=5)"]
      interval: 20s
      timeout: 7s
      start_period: 30s
      retries: 5

  analysis-api:
    <<: *analysis
    mem_limit: 1g
    command: [gunicorn, config.wsgi:application, --bind, "0.0.0.0:8000", --workers, "1"]
    depends_on:
      analysis-migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/', timeout=5)"]
      interval: 20s
      timeout: 7s
      start_period: 30s
      retries: 5

  game-tasks:
    <<: *game
    mem_limit: 512m
    command: [python, manage.py, run_tasks_worker, --interval, "5", --limit, "50"]
    depends_on:
      game-api: {condition: service_started}
      tournaments-api: {condition: service_started}

  tournaments-tasks:
    <<: *tournaments
    mem_limit: 512m
    command: [python, manage.py, run_tasks_worker, --interval, "5", --limit, "50"]
    depends_on:
      tournaments-api: {condition: service_started}

  push-worker:
    <<: *tournaments
    mem_limit: 512m
    command: [python, manage.py, run_push_notifications, --interval, "5"]
    depends_on:
      tournaments-api: {condition: service_started}

  analysis-worker:
    <<: *analysis
    mem_limit: 1g
    command: [python, manage.py, process_analyses]
    depends_on:
      analysis-api: {condition: service_started}

  game-frontend:
    <<: *frontend
    image: backgammon-local-game-frontend
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      target: development
      args: {APP_DIR: Backgammon Game/frontend}
    environment:
      VITE_SERVER_URL: /backgammon
      VITE_TOURNAMENTS_URL: http://backgammon.localhost:8180/tournaments/

  tournaments-frontend:
    <<: *frontend
    image: backgammon-local-tournaments-frontend
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      target: development
      args: {APP_DIR: backgammon-tournaments}
    environment:
      VITE_API_URL: http://tournaments-api:8000
      VITE_GAME_URL: /backgammon/

  admin-frontend:
    <<: *frontend
    image: backgammon-local-admin-frontend
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      target: development
      args: {APP_DIR: backgammon-tournaments-backend/admin-frontend}
    environment:
      VITE_API_URL: http://tournaments-api:8000

  gateway:
    <<: *process
    image: nginx:1.28-alpine
    mem_limit: 128m
    ports: ["127.0.0.1:8180:8180"]
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
      - game_static:/srv/game-static:ro
      - tournaments_static:/srv/tournaments-static:ro
      - tournaments_media:/srv/media:ro
    networks:
      application:
        aliases: [backgammon.localhost]
    depends_on:
      game-api: {condition: service_started}
      tournaments-api: {condition: service_started}
      game-frontend: {condition: service_healthy}
      tournaments-frontend: {condition: service_healthy}
      admin-frontend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8180/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5

networks:
  application:

volumes:
  postgres_data:
  redis_data:
  game_static:
  tournaments_static:
  tournaments_media:

secrets:
  postgres_password: {file: ./.local/postgres_password}
  game_password: {file: ./.local/game_password}
  tournaments_password: {file: ./.local/tournaments_password}
  analysis_password: {file: ./.local/analysis_password}
  game_config: {file: ./.local/game.json}
  tournaments_config: {file: ./.local/tournaments.json}
  analysis_config: {file: ./.local/analysis.json}
