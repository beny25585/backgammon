name: backgammon-production

x-process: &process
  init: true
  restart: unless-stopped
  logging:
    driver: local
    options: {max-size: "10m", max-file: "3"}
  networks: [application]

x-game: &game
  <<: *process
  pull_policy: never
  image: backgammon-production-game:${IMAGE_TAG:?Set IMAGE_TAG}
  build:
    context: ..
    dockerfile: docker/python.Dockerfile
    args: {APP_DIR: Backgammon Game/backend}
  environment:
    DJANGO_SETTINGS_MODULE: backgammon_project.settings_docker
    RUNTIME_CONFIG_FILE: /run/secrets/game_config
    DB_HOST: postgres
    DB_NAME: backgammon_game
    DB_USER: backgammon_game
    DB_PASSWORD_FILE: /run/secrets/game_password
    DEBUG: "False"
    ALLOWED_HOSTS: ${PUBLIC_HOST:?Set PUBLIC_HOST},localhost,127.0.0.1,game-api
    CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
    CSRF_TRUSTED_ORIGINS: ${PUBLIC_ORIGIN}
    REDIS_URL: redis://redis:6379/0
    GAMELINK_TOURNAMENTS_URL: ${PUBLIC_ORIGIN}
    GAMELINK_TOURNAMENTS_FRONTEND_URL: ${PUBLIC_ORIGIN}/tournaments/
    GAMELINK_FRONTEND_URL: ${PUBLIC_ORIGIN}/backgammon
    DICE_SERVICE_URL: http://dice:4000
    AI_SERVICE_URL: http://analysis-api:8000
    ANALYSIS_SERVICE_URL: http://analysis-api:8000
  secrets: [game_config, game_password]
  volumes: [game_static:/data/static]

x-tournaments: &tournaments
  <<: *process
  pull_policy: never
  image: backgammon-production-tournaments:${IMAGE_TAG:?Set IMAGE_TAG}
  build:
    context: ..
    dockerfile: docker/python.Dockerfile
    args: {APP_DIR: backgammon-tournaments-backend}
  working_dir: /app/tournaments
  environment:
    DJANGO_SETTINGS_MODULE: tournaments.settings.docker
    RUNTIME_CONFIG_FILE: /run/secrets/tournaments_config
    DB_HOST: postgres
    DB_NAME: backgammon_tournaments
    DB_USER: backgammon_tournaments
    DB_PASSWORD_FILE: /run/secrets/tournaments_password
    DEBUG: "0"
    ALLOWED_HOSTS: ${PUBLIC_HOST},localhost,127.0.0.1,tournaments-api
    CSRF_TRUSTED_ORIGINS: ${PUBLIC_ORIGIN}
    CHANNEL_LAYER_BACKEND: redis
    REDIS_URL: redis://redis:6379/1
    GAMELINK_BACKGAMMON_URL: ${PUBLIC_ORIGIN}
    ACCOUNT_FRONTEND_URL: ${PUBLIC_ORIGIN}/tournaments
    ANALYSIS_SERVICE_URL: http://analysis-api:8000
  secrets: [tournaments_config, tournaments_password]
  volumes:
    - tournaments_static:/data/static
    - tournaments_media:/data/media

x-analysis: &analysis
  <<: *process
  pull_policy: never
  image: backgammon-production-analysis:${IMAGE_TAG:?Set IMAGE_TAG}
  build: {context: .., dockerfile: docker/analysis.Dockerfile}
  environment:
    DJANGO_SETTINGS_MODULE: config.docker
    RUNTIME_CONFIG_FILE: /run/secrets/analysis_config
    DB_HOST: postgres
    DB_NAME: backgammon_analysis
    DB_USER: backgammon_analysis
    DB_PASSWORD_FILE: /run/secrets/analysis_password
    DEBUG: "0"
    ALLOWED_HOSTS: localhost,127.0.0.1,analysis-api
  secrets: [analysis_config, analysis_password]

x-frontend: &frontend
  <<: *process
  pull_policy: never
  profiles: [live]
  mem_limit: 64m
  healthcheck:
    test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1/"]
    interval: 20s
    timeout: 5s
    retries: 5

services:
  prometheus:
    <<: *process
    profiles: [monitoring]
    image: prom/prometheus:v3.13.4
    user: "65534:65534"
    mem_limit: 256m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [monitoring]
    ports: ["127.0.0.1:19090:9090"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus.backgammon.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:9090/-/ready"]
      interval: 20s
      timeout: 5s
      retries: 5
  postgres:
    <<: *process
    image: postgres:16
    mem_limit: 768m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
    secrets: [postgres_password, game_password, tournaments_password, analysis_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_databases.sh:/docker-entrypoint-initdb.d/10-app-databases.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    <<: *process
    image: redis:7-alpine
    mem_limit: 192m
    command: [redis-server, --appendonly, "yes", --maxmemory, 96mb, --maxmemory-policy, noeviction]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10
  dice:
    <<: *process
    pull_policy: never
    image: backgammon-production-dice:${IMAGE_TAG}
    build: {context: .., dockerfile: docker/dice.Dockerfile}
    mem_limit: 192m
    environment: {PORT: "4000", DICE_BIND_HOST: 0.0.0.0}
    healthcheck:
      test: [CMD, curl, --fail, --silent, "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
  game-migrate:
    <<: *game
    profiles: [operations]
    restart: "no"
    command: [sh, -c, "python manage.py migrate --noinput && python manage.py collectstatic --noinput"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  tournaments-migrate:
    <<: *tournaments
    profiles: [operations]
    restart: "no"
    command: [sh, -c, "python manage.py migrate --noinput && python manage.py collectstatic --noinput"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  analysis-migrate:
    <<: *analysis
    profiles: [operations]
    restart: "no"
    command: [python, manage.py, migrate, --noinput]
    depends_on:
      postgres: {condition: service_healthy}
  tournaments-transfer:
    <<: *tournaments
    profiles: [operations]
    restart: "no"
    mem_limit: 1g
    command: [python, /opt/docker/tournaments_transfer.py, verify, --directory, /transfer/tournaments]
    volumes: ["${TRANSFER_DIR:?Set TRANSFER_DIR}:/transfer:ro"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  game-api:
    <<: *game
    profiles: [live]
    mem_limit: 384m
    ports: ["127.0.0.1:${GAME_API_PORT:-18005}:8000"]
    command: [sh, -c, "python manage.py migrate --check && exec daphne -b 0.0.0.0 -p 8000 --access-log - backgammon_project.asgi:application"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      dice: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=5)"]
      interval: 20s
      timeout: 7s
      start_period: 30s
      retries: 5
  tournaments-api:
    <<: *tournaments
    profiles: [live]
    mem_limit: 384m
    ports: ["127.0.0.1:${TOURNAMENTS_API_PORT:-18006}:8000"]
    command: [sh, -c, "python manage.py migrate --check && exec daphne -b 0.0.0.0 -p 8000 --access-log - tournaments.asgi:application"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=5)"]
      interval: 20s
      timeout: 7s
      start_period: 30s
      retries: 5
  analysis-api:
    <<: *analysis
    profiles: [live]
    mem_limit: 512m
    ports: ["127.0.0.1:${ANALYSIS_API_PORT:-18007}:8000"]
    command: [sh, -c, "python manage.py migrate --check && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1 --threads 2 --timeout 120 --access-logfile - --error-logfile -"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/', timeout=5)"]
      interval: 20s
      timeout: 7s
      start_period: 30s
      retries: 5
  game-tasks:
    <<: *game
    profiles: [workers]
    mem_limit: 256m
    command: [python, manage.py, run_tasks_worker, --interval, "5", --limit, "50"]
    depends_on:
      game-api: {condition: service_started}
      tournaments-api: {condition: service_started}
  tournaments-tasks:
    <<: *tournaments
    profiles: [tournament-workers]
    mem_limit: 256m
    command: [python, manage.py, run_tasks_worker, --interval, "5", --limit, "50"]
    depends_on:
      tournaments-api: {condition: service_started}
  push-worker:
    <<: *tournaments
    profiles: [workers]
    mem_limit: 256m
    command: [python, manage.py, run_push_notifications, --interval, "5"]
    depends_on:
      tournaments-api: {condition: service_started}
  analysis-worker:
    <<: *analysis
    profiles: [workers]
    mem_limit: 768m
    command: [python, manage.py, process_analyses]
    depends_on:
      analysis-api: {condition: service_started}
  game-frontend:
    <<: *frontend
    image: backgammon-production-game-frontend:${IMAGE_TAG}
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      target: production
      args:
        APP_DIR: Backgammon Game/frontend
        VITE_SERVER_URL: /backgammon
        VITE_TOURNAMENTS_URL: ${PUBLIC_ORIGIN}/tournaments/
    ports: ["127.0.0.1:${GAME_FRONTEND_PORT:-18105}:80"]
    volumes: [game_static:/srv/game-static:ro]
  tournaments-frontend:
    <<: *frontend
    image: backgammon-production-tournaments-frontend:${IMAGE_TAG}
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      target: production
      args: {APP_DIR: backgammon-tournaments, VITE_GAME_URL: /backgammon/}
    ports: ["127.0.0.1:${TOURNAMENTS_FRONTEND_PORT:-18106}:80"]
    volumes: [tournaments_static:/srv/tournaments-static:ro, tournaments_media:/srv/media:ro]
  admin-frontend:
    <<: *frontend
    image: backgammon-production-admin-frontend:${IMAGE_TAG}
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      target: production
      args: {APP_DIR: backgammon-tournaments-backend/admin-frontend}
    ports: ["127.0.0.1:${ADMIN_FRONTEND_PORT:-18108}:80"]

networks:
  application:
  monitoring:
volumes:
  prometheus_data:
  postgres_data:
  redis_data:
  game_static:
  tournaments_static:
  tournaments_media:
secrets:
  postgres_password: {file: "${CONFIG_DIR}/postgres_password"}
  game_password: {file: "${CONFIG_DIR}/game_password"}
  tournaments_password: {file: "${CONFIG_DIR}/tournaments_password"}
  analysis_password: {file: "${CONFIG_DIR}/analysis_password"}
  game_config: {file: "${CONFIG_DIR}/game.json"}
  tournaments_config: {file: "${CONFIG_DIR}/tournaments.json"}
  analysis_config: {file: "${CONFIG_DIR}/analysis.json"}
