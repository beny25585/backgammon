map "$status:$uri" $frontend_asset_cache_control {
    default "no-store";
    "~^(?:200|206|304):/assets/[^/]+-[A-Za-z0-9_-]{8}\.[A-Za-z0-9]+$" "public, max-age=31536000, immutable";
    ~^(?:200|206|304): "no-cache";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location /backgammon/static/ { alias /srv/game-static/; }
    location /static/ { alias /srv/tournaments-static/; }
    location /media/ { alias /srv/media/; }
    location /tournaments-static/ { alias /srv/tournaments-static/; }
    location /tournaments-media/ { alias /srv/media/; }
    location ~ ^/(?:(?:6b/)?(?:backgammon|tournaments|tournaments-admin)/)?assets/ {
        rewrite ^/(?:6b/)?(backgammon|tournaments|tournaments-admin)/(.*)$ /$2 break;
        try_files $uri =404;
        add_header Cache-Control $frontend_asset_cache_control always;
    }
    location / {
        rewrite ^/(?:6b/)?(backgammon|tournaments|tournaments-admin)/(.*)$ /$2 break;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
