map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Docker can assign a new address when an application container is replaced.
resolver 127.0.0.11 valid=5s ipv6=off;
upstream game_api { zone game_api 64k; server game-api:8000 resolve; }
upstream tournaments_api { zone tournaments_api 64k; server tournaments-api:8000 resolve; }
upstream game_frontend { zone game_frontend 64k; server game-frontend:5173 resolve; }
upstream tournaments_frontend { zone tournaments_frontend 64k; server tournaments-frontend:5173 resolve; }
upstream admin_frontend { zone admin_frontend 64k; server admin-frontend:5173 resolve; }

server {
    listen 8180;
    server_name localhost 127.0.0.1;
    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }
    location / { return 308 http://backgammon.localhost:8180$request_uri; }
}

server {
    listen 8180;
    server_name backgammon.localhost;
    client_max_body_size 10m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }
    location = / { return 302 /6b/tournaments/$is_args$args; }
    location = /6b { return 308 /6b/; }
    location = /6b/ { return 302 /6b/tournaments/$is_args$args; }
    location = /6b/tournaments { return 308 /6b/tournaments/$is_args$args; }
    location = /6b/backgammon { return 308 /6b/backgammon/$is_args$args; }
    location = /tournaments { return 308 /6b/tournaments/$is_args$args; }
    location = /backgammon { return 308 /6b/backgammon/$is_args$args; }
    location = /tournaments-admin { return 308 /tournaments-admin/; }

    location /backgammon/api/ { proxy_pass http://game_api/api/; }
    location /backgammon/ws/ { proxy_pass http://game_api/ws/; }
    location /api/link/ { proxy_pass http://game_api/api/link/; }
    location /tournaments-api/ { proxy_pass http://tournaments_api/api/; }
    location /tournaments-play/ { proxy_pass http://tournaments_api/t/; }
    location /tournaments-ws/ { proxy_pass http://tournaments_api/ws/; }
    location /api/ { proxy_pass http://tournaments_api/api/; }
    location /t/ { proxy_pass http://tournaments_api/t/; }
    location /admin/ { proxy_pass http://tournaments_api/admin/; }

    location /backgammon/static/ { alias /srv/game-static/; }
    location /static/ { alias /srv/tournaments-static/; }
    location /media/ { alias /srv/media/; }

    location = /backgammon/manifest.webmanifest {
        proxy_pass http://game_frontend/6b/backgammon/manifest.webmanifest;
    }
    location = /tournaments/manifest.webmanifest {
        proxy_pass http://game_frontend/6b/backgammon/manifest.webmanifest;
    }
    location = /backgammon/sw.js { proxy_pass http://game_frontend/6b/backgammon/legacy-sw.js; }
    location = /tournaments/push-sw.js { proxy_pass http://tournaments_frontend/6b/tournaments/push-sw.js; }
    location /backgammon/ { return 308 /6b$request_uri; }
    location /tournaments/ { return 308 /6b$request_uri; }
    location /6b/backgammon/ { proxy_pass http://game_frontend; }
    location /6b/tournaments/ { proxy_pass http://tournaments_frontend; }
    location /tournaments-admin/ { proxy_pass http://admin_frontend; }
}
