# Reviewed replacement blocks inside the EXISTING HTTPS server in calander_assist.
# Do not replace nginx.conf or the other applications' locations.
# API ports 8005/8006 remain unchanged after the maintenance-window cutover.
# Replace the old /backgammon static/frontend and both tournament frontend blocks.
# Set these ports to the corresponding values in production.env if changed.

# WebSocket updates use the ASGI API port (8006 after cutover, 18006 before it).
location /tournaments-ws/ {
    proxy_pass http://127.0.0.1:8006/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location = /backgammon { return 301 /backgammon/; }
location /backgammon/static/ {
    proxy_pass http://127.0.0.1:18105;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /backgammon/ {
    proxy_pass http://127.0.0.1:18105;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
location /tournaments/ {
    proxy_pass http://127.0.0.1:18106;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /tournaments-admin/ {
    proxy_pass http://127.0.0.1:18108;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /tournaments-static/ {
    proxy_pass http://127.0.0.1:18106;
    proxy_set_header Host $host;
}
location /tournaments-media/ {
    proxy_pass http://127.0.0.1:18106;
    proxy_set_header Host $host;
}
