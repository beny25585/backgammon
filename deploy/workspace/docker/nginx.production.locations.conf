# Include this file inside the EXISTING HTTPS server in calander_assist:
# include /etc/backgammon-docker/nginx.production.locations.conf;
# Do not replace nginx.conf or the other applications' locations.
# API ports 8005/8006 remain unchanged after the maintenance-window cutover.
# Replace the old /backgammon static/frontend and both tournament frontend blocks.
# Set these ports to the corresponding values in production.env if changed.

# WebSocket updates use the ASGI API port (8006 after cutover, 18006 before it).
location /tournaments-ws/ {
    proxy_pass http://127.0.0.1:8006/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location = /6b { return 308 /6b/; }
location = /6b/ { return 302 /6b/tournaments/$is_args$args; }
location = /6b/backgammon { return 308 /6b/backgammon/$is_args$args; }
location = /6b/tournaments { return 308 /6b/tournaments/$is_args$args; }

# Keep legacy installation metadata and worker updates available without
# redirects. Preserve the existing PWA id; update only its scope/start URL.
location = /backgammon/manifest.webmanifest {
    proxy_pass http://127.0.0.1:18105/6b/backgammon/manifest.webmanifest;
    proxy_set_header Host $host;
    add_header Cache-Control "no-cache" always;
}
location = /tournaments/manifest.webmanifest {
    proxy_pass http://127.0.0.1:18105/6b/backgammon/manifest.webmanifest;
    proxy_set_header Host $host;
    add_header Cache-Control "no-cache" always;
}
location = /backgammon/sw.js {
    proxy_pass http://127.0.0.1:18105/6b/backgammon/legacy-sw.js;
    proxy_set_header Host $host;
    add_header Cache-Control "no-cache" always;
}
location = /tournaments/push-sw.js {
    proxy_pass http://127.0.0.1:18106/6b/tournaments/push-sw.js;
    proxy_set_header Host $host;
    add_header Cache-Control "no-cache" always;
}

# Existing API/WebSocket locations in the parent server remain in place.
location = /backgammon { return 308 /6b/backgammon/$is_args$args; }
location /backgammon/static/ {
    proxy_pass http://127.0.0.1:18105;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /backgammon/ {
    return 308 /6b$request_uri;
}
location = /tournaments { return 308 /6b/tournaments/$is_args$args; }
location /tournaments/ {
    return 308 /6b$request_uri;
}
location /6b/backgammon/ {
    proxy_pass http://127.0.0.1:18105;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
location /6b/tournaments/ {
    proxy_pass http://127.0.0.1:18106;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /tournaments-admin/ {
    proxy_pass http://127.0.0.1:18108;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /tournaments-static/ {
    proxy_pass http://127.0.0.1:18106;
    proxy_set_header Host $host;
}
location /tournaments-media/ {
    proxy_pass http://127.0.0.1:18106;
    proxy_set_header Host $host;
}
