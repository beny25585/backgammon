<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6B — בדיקת הרשאת התראות</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #09101f; color: #f1f5f9; font: 18px/1.65 system-ui, sans-serif; }
  main { max-width: 640px; margin: auto; padding: 24px; }
  h1 { font-size: 26px; }
  button, a { font: inherit; }
  button { padding: 12px 18px; background: #3975ff; color: white; border: 0; border-radius: 8px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  a { color: #fcd34d; display: block; margin: 16px 0; }
  pre { overflow-wrap: anywhere; white-space: pre-wrap; background: #151a23; padding: 16px; border-radius: 8px; font-size: 14px; }
</style>
<main>
  <h1>בדיקת הרשאת התראות</h1>
  <p id="context"></p>
  <p>בודקים קודם בטורנירים ואחר כך במשחק, באותו טלפון ובאותו Chrome. השאר בינתיים את הגדרות ההתראות כפי שהן.</p>
  <p>הכפתור מבקש הרשאה בלבד. אם מופיע חלון אישור, צלם אותו לפני בחירה כדי שנוכל לראות שהבקשה נפתחה.</p>
  <button id="request" type="button">בדיקת חלון האישור</button>
  <p id="status" role="status" aria-live="polite"></p>
  <pre id="report" dir="ltr"></pre>
  <button id="copy" type="button">העתקת דו״ח</button>
  <a href="/tournaments/notification-permission-check.html">1. בדיקה מתוך הטורנירים</a>
  <a href="/backgammon/notification-permission-check.html">2. בדיקה מתוך המשחק</a>
</main>
<script>
  // Temporary support page: no account access, subscriptions, storage, or telemetry.
  const requestButton = document.querySelector('#request');
  const status = document.querySelector('#status');
  const output = document.querySelector('#report');
  const supported = 'Notification' in window && window.isSecureContext;
  const inGame = location.pathname.startsWith('/backgammon/');
  document.querySelector('#context').textContent = inGame ? 'מיקום הבדיקה: המשחק' : 'מיקום הבדיקה: הטורנירים';
  const report = {
    version: 1, path: location.pathname, secureContext: window.isSecureContext,
    topLevel: window.top === window, visibility: document.visibilityState,
    standalone: matchMedia('(display-mode: standalone)').matches,
    permissionBefore: supported ? Notification.permission : 'unavailable',
    stage: 'ready',
  };
  const render = () => { output.textContent = JSON.stringify(report, null, 2); };
  render();
  requestButton.disabled = !supported || Notification.permission !== 'default';
  if (!supported) status.textContent = 'הבדיקה דורשת Chrome עם תמיכה בהתראות וכתובת HTTPS.';
  else if (Notification.permission === 'granted') status.textContent = 'ההרשאה כבר מאושרת. במצב הזה אי אפשר לבדוק הופעת בקשה ראשונה.';
  else if (Notification.permission === 'denied') status.textContent = 'Chrome מדווח על הרשאה חסומה. העתק את הדו״ח לפני שינוי הגדרות.';

  requestButton.addEventListener('click', async () => {
    if (requestButton.disabled) return;
    report.permissionBefore = Notification.permission;
    report.visibility = document.visibilityState;
    report.userActivation = navigator.userActivation?.isActive ?? null;
    report.stage = 'requesting';
    const started = performance.now();
    requestButton.disabled = true;
    try {
      // Keep this call synchronous with the click, before any await or network request.
      const pending = Notification.requestPermission();
      render();
      status.textContent = 'הבקשה נשלחה ל־Chrome. אם הופיע חלון אישור, צלם אותו.';
      report.permissionResult = await pending;
      report.permissionAfter = Notification.permission;
      report.stage = 'complete';
      status.textContent = 'הבדיקה הסתיימה. העתק את הדו״ח ושלח אותו יחד עם תיאור: האם הופיע חלון אישור?';
    } catch (error) {
      report.stage = 'error';
      report.errorName = error?.name || 'UnknownError';
      status.textContent = 'הבקשה נכשלה. העתק את הדו״ח לבדיקה.';
    } finally {
      report.elapsedMs = Math.round(performance.now() - started);
      render();
    }
  });
  document.querySelector('#copy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(output.textContent);
      status.textContent = 'הדו״ח הועתק.';
    } catch {
      status.textContent = 'אפשר לצלם את הדו״ח או לבחור את הטקסט ולהעתיק ידנית.';
    }
  });
</script>
</html>
