<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/backgammon/pwa-icon-192.png" />
    <link rel="apple-touch-icon" href="/backgammon/pwa-icon-192.png" />
    <link rel="manifest" href="/backgammon/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The app already provides a complete dark palette. Advertising it prevents
         browsers such as Samsung Internet from auto-darkening the board colors. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#03090a" />
    <style>
      html, body, #root { color-scheme: dark; background-color: #03090a; }
    </style>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Backgammon" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Backgammon – Online Game</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/backgammon/sw.js", {
            scope: "/backgammon/",
          });
        });
      }
    </script>
  </body>
</html>
